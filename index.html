<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- PAGE:START -->
<title>Puckbound</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Puckbound">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="src/fonts.css">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Hockey rink"></canvas>
  <div id="hud" hidden></div>
  <div id="touch" hidden>
    <div class="stick-zone"></div>
    <div class="stick"><div class="stick-knob"></div></div>
    <button class="tbtn t-a" data-btn="a" aria-label="Shoot or check"><span>SHOOT</span></button>
    <button class="tbtn t-b" data-btn="b" aria-label="Pass or switch"><span>PASS</span></button>
    <button class="tbtn t-sprint" data-btn="sprint" aria-label="Sprint"><span>SPRINT</span></button>
    <button class="tbtn t-skill" data-btn="skill" aria-label="Skill"><img alt=""><div class="cd"></div></button>
    <button class="tbtn t-ult" data-btn="ult" aria-label="Ultimate"><img alt=""><div class="cd"></div></button>
    <button class="tbtn t-pull" data-btn="pull" aria-label="Pull the goalie" hidden><span>PULL<br>GOALIE</span></button>
  </div>
  <div id="banner"></div>
  <div id="screen"></div>
  <div id="rotate" hidden><div><div class="ph">▯</div><p>Turn your phone sideways</p><span class="muted">Matches are played in landscape.</span></div></div>
  <div id="loading"><div><div class="logo">Puck<br>bound</div><div class="bar"><i></i></div><div class="err"></div></div></div>
</div>
<script type="module" src="src/main.js"></script>
<!-- PAGE:END -->
</body>
</html>
